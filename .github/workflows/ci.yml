name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-organizational-unit-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate YAML + JSON catalog entries against entity.schema.json.
      # Replaces the previously-pinned ajvdotpy/ajv-py-action@v1 — that
      # action repository does not exist on GitHub, so the workflow was
      # failing on action-resolution before any validation could run.
      # See the companion PR in dea-catalog-business-objects for the full
      # diagnostic. Three catalog CIs were affected by the same scaffold
      # bug; this PR fixes the OU side.
      - name: Validate catalog entries against OrganizationalUnit schema
        uses: dsanders11/json-schema-validate-action@v1
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json
